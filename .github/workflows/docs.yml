name: Documentation
on:
  push:
    branches: [master, docs/component-layout, fix/spotlight-anchor, feat/admin-layout, feat/tag-select, feat/tag-select-all, fix/list-sort-handle]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:docs
      - run: npm run test:package
      - run: cmp packages/mtone/llms.txt dist/docs/llms.txt
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/tag-select.browser.mjs
      - run: node tests/tree-select.browser.mjs
      - run: node tests/date-picker.browser.mjs
      - run: node tests/select-layout.browser.mjs
      - run: node tests/select-focus.browser.mjs
      - run: node tests/spotlight.browser.mjs
      - run: node tests/input-family.browser.mjs
      - run: node tests/input-focus.browser.mjs
      - run: node tests/field-focus.browser.mjs
      - run: node tests/focus-unify.browser.mjs
      - run: node tests/control-height.browser.mjs
      - run: node tests/menu-icons.browser.mjs
      - run: node tests/menu.browser.mjs
      - run: node tests/menu-spacing.browser.mjs
      - run: node tests/dropdown.browser.mjs
      - run: node tests/menubar.browser.mjs
      - run: node tests/loading-overlay.browser.mjs
      - name: Docs search browser regressions
        run: |
          for browser in chromium firefox webkit; do
            BROWSER=$browser node tests/docs-search.browser.mjs
          done
      - name: Component detail browser regressions
        run: |
          for browser in chromium firefox webkit; do
            BROWSER=$browser node tests/component-layout.browser.mjs || exit 1
          done
      - run: node tests/hover-card-arrow.browser.mjs
      - run: node tests/hover-card.browser.mjs
      - run: node tests/hover-card-portals.browser.mjs
      - run: node tests/card.browser.mjs
      - run: node tests/table.browser.mjs
      - run: node tests/mentions.browser.mjs
      - run: node tests/calendar.browser.mjs
      - run: node tests/rate.browser.mjs
      - run: node tests/timeline.browser.mjs
      - run: node tests/tree.browser.mjs
      - run: node tests/image.browser.mjs
      - run: node tests/table-of-contents.browser.mjs
      - run: node tests/transfer.browser.mjs
      - run: node tests/tabs.browser.mjs
      - run: node tests/divider.browser.mjs
      - run: node tests/button-group.browser.mjs
      - run: node tests/typography.browser.mjs
      - name: List browser regressions
        run: |
          for browser in chromium firefox webkit; do
            BROWSER=$browser node tests/list.browser.mjs
          done
      - name: Typography navigation browser regressions
        run: |
          for browser in chromium firefox webkit; do
            BROWSER=$browser node tests/typography-navigation.browser.mjs
          done
      - run: node tests/breadcrumb.browser.mjs
      - run: node tests/auto-complete.browser.mjs
      - run: node tests/cascader.browser.mjs
      - run: node tests/avatar-popconfirm.browser.mjs
      - run: node tests/affix.browser.mjs
      - run: node tests/result.browser.mjs
      - name: Splitter browser regressions
        run: |
          status=0
          node tests/splitter-cycle.browser.mjs || status=1
          node tests/splitter.browser.mjs || status=1
          exit $status
      - run: node tests/form.browser.mjs
      - run: node tests/modal-layout.browser.mjs
      - run: node tests/showcase.browser.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: dist/docs
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
