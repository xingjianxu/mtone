name: Documentation
on:
  push:
    branches: [master, 'release-candidate/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && '-ignored' || '' }}
  cancel-in-progress: true
jobs:
  targeted:
    name: Targeted validation
    if: github.event.deleted != true && startsWith(github.ref, 'refs/heads/release-candidate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact candidate checkout
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pattern='^refs/heads/release-candidate/([0-9a-f]{40})/([0-9a-f]{40})$'
          if [[ ! "$GITHUB_REF" =~ $pattern ]]; then
            echo "::error::Expected release-candidate/<exact-master-SHA>/<exact-candidate-SHA>."
            exit 1
          fi
          base=${BASH_REMATCH[1]}
          candidate=${BASH_REMATCH[2]}
          test "$candidate" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$candidate"
          git rev-parse 'HEAD^{tree}'
          git diff --exit-code HEAD --
          git merge-base --is-ancestor "$base" "$candidate"
          git diff --check "$base" "$candidate" --
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$base" != "$current" ]]; then
            echo "::error::Candidate baseline no longer equals current master; integrate the new baseline and recreate candidate."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan checks from the exact diff
        id: plan
        env:
          BASE_SHA: ${{ steps.source.outputs.base }}
        run: node scripts/check-targeted-changes.mjs "$BASE_SHA" "$GITHUB_SHA" --plan
      - if: steps.plan.outputs.needs_npm == 'true'
        run: npm ci
      - name: Run targeted checks
        env:
          BASE_SHA: ${{ steps.source.outputs.base }}
        run: node scripts/check-targeted-changes.mjs "$BASE_SHA" "$GITHUB_SHA" --run
      - name: Assert tracked files unchanged
        run: git diff --exit-code HEAD --

  build-pages:
    name: Build verified Pages
    if: github.event_name == 'push' && github.event.deleted != true && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require successful targeted validation for this baseline and tree
        env:
          GH_TOKEN: ${{ github.token }}
          MTONE_BASE_SHA: ${{ github.event.before }}
        run: node scripts/verify-docs-regression.mjs
      - run: npm ci
      - run: npm run build:docs
      - run: cmp packages/mtone/llms.txt dist/docs/llms.txt
      - run: git diff --exit-code HEAD --
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs
  deploy:
    if: github.event_name == 'push' && github.event.deleted != true && github.ref == 'refs/heads/master'
    needs: build-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require current master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::This run is no longer for current master; use the latest Documentation run."
            exit 1
          fi
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
