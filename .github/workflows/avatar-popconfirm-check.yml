name: Avatar and Popconfirm verification
on:
  push:
    branches: [feat-avatar-popconfirm]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avatar-popconfirm-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- tests/avatar.test.tsx tests/avatar-styles.test.ts tests/popconfirm.test.tsx tests/popconfirm-styles.test.ts tests/avatar-popconfirm-docs.test.tsx
      - run: npm run build:docs
      - run: npm run test:package
      - run: cmp packages/mtone/llms.txt dist/docs/llms.txt
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/avatar-popconfirm.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-popconfirm-browser-results
          path: artifacts
          if-no-files-found: ignore
