name: Menubar verification
on:
  push:
    branches: [fix/menu-submenu-height-ci]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: menubar-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:docs
      - run: npm run test:package
      - run: cmp packages/mtone/llms.txt dist/docs/llms.txt
      - run: HOME=/root node tests/menu-spacing.browser.mjs
      - run: HOME=/root node tests/menu.browser.mjs
      - run: HOME=/root node tests/menubar.browser.mjs
      - run: HOME=/root node tests/dropdown.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menubar-browser-results
          path: artifacts
          if-no-files-found: ignore
