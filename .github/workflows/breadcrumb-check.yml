name: Breadcrumb feature verification
on:
  push:
    branches: [feat/breadcrumb-upgrade]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:docs
      - run: node tests/breadcrumb.browser.mjs
