name: Typography verification
on:
  push:
    branches: [feat-typography, docs/typography-nav, fix/focus-unify, feat/input-redesign, feat/list-upgrade]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typography-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- tests/typography.test.tsx tests/typography-docs.test.tsx tests/blockquote.test.tsx tests/input-family.test.tsx tests/input-otp.test.tsx tests/spotlight.test.tsx tests/focus-unify.test.ts tests/list.test.tsx
      - run: npm run build:docs
      - run: npm run test:package
      - run: cmp packages/mtone/llms.txt dist/docs/llms.txt
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/select-layout.browser.mjs
      - run: node tests/select-focus.browser.mjs
      - run: node tests/spotlight.browser.mjs
      - run: node tests/input-family.browser.mjs
      - run: node tests/input-focus.browser.mjs
      - run: node tests/field-focus.browser.mjs
      - run: node tests/focus-unify.browser.mjs
      - run: node tests/control-height.browser.mjs
      - run: node tests/typography.browser.mjs
      - name: List browser regressions
        run: |
          for browser in chromium firefox webkit; do
            BROWSER=$browser node tests/list.browser.mjs
          done
      - name: Typography navigation browser regressions
        run: |
          for browser in chromium firefox webkit; do
            BROWSER=$browser node tests/typography-navigation.browser.mjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typography-browser-results
          path: artifacts
          if-no-files-found: ignore
