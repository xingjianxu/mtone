name: Publish npm package
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    name: Verify release package
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact release checkout
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release metadata and approved license
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:docs
      - run: npm run test:package
      - run: cmp packages/mtone/llms.txt dist/docs/llms.txt
      - name: Assert tracked files unchanged
        run: git diff --exit-code HEAD --
      - run: npm pack -w @bixlab/mtone --dry-run
  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact release checkout
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release metadata and approved license
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run build -w @bixlab/mtone
      - name: Publish using npm trusted publishing (OIDC)
        run: npm publish -w @bixlab/mtone --access public --provenance
