name: Publish npm package
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:docs
      - run: npx playwright install --with-deps chromium
      - run: node tests/select-layout.browser.mjs
      - run: npm run test:package
      - run: npm pack -w @bixlab/mtone --dry-run
  publish:
    # Manual runs validate only. Only a non-prerelease GitHub Release publishes.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release metadata and approved license
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run build -w @bixlab/mtone
      - name: Publish using npm trusted publishing (OIDC)
        run: npm publish -w @bixlab/mtone --access public --provenance
