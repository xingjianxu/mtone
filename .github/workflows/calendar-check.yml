name: Calendar verification
on:
  push:
    branches: [feat-calendar]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calendar-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- tests/calendar.test.tsx tests/calendar-model.test.tsx tests/calendar-styles.test.ts tests/calendar-docs.test.tsx
      - run: npm run build:docs
      - run: npm run test:package
      - run: cmp packages/mtone/llms.txt dist/docs/llms.txt
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/calendar.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-browser-results
          path: artifacts/calendar-browser
          if-no-files-found: ignore
