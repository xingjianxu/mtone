name: Select verification
on:
  push:
    branches: [fix-select-option-focus]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: select-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:docs
      - run: npm run test:package
      - run: cmp packages/mtone/llms.txt dist/docs/llms.txt
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/select-focus.browser.mjs
      - run: node tests/select-layout.browser.mjs
      - run: node tests/field-focus.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: select-focus-results
          path: artifacts/select-focus
          if-no-files-found: ignore
